apiVersion: v1
kind: Namespace
metadata:
  name: opentelemetry
  labels:
    # The node collector requires hostPath mounts for logs and host metrics.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opentelemetry
  namespace: flux-system
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-agent
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: opentelemetry
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.177.0
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: otel-agent-values
      valuesKey: values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-gateway
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: opentelemetry
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.177.0
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: otel-gateway-values
      valuesKey: values.yaml