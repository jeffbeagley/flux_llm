apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-cdi-configurator
  namespace: nvidia-device-plugin
spec:
  selector:
    matchLabels:
      app: nvidia-cdi-configurator
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvidia-cdi-configurator
    spec:
      hostPID: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/nonfree-kmod-nvidia-production
                    operator: Exists
      initContainers:
        - name: cdi-generate
          image: busybox
          # nsenter into host mount namespace to run the Talos-installed nvidia-ctk
          command:
            - nsenter
            - "--target"
            - "1"
            - "--mount"
            - "--"
            - sh
            - -c
            - mkdir -p /etc/cdi && /usr/local/bin/nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
          securityContext:
            privileged: true
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            limits:
              cpu: 10m
              memory: 10Mi
