apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: dcgm-exporter
  namespace: flux-system
spec:
  interval: 1h
  ref:
    tag: 4.8.4
  url: https://github.com/NVIDIA/dcgm-exporter.git
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
  namespace: nvidia-device-plugin
spec:
  interval: 1h
  dependsOn:
    - name: nvidia-device-plugin
  targetNamespace: nvidia-device-plugin
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./deployment
      sourceRef:
        kind: GitRepository
        name: dcgm-exporter
        namespace: flux-system
  values:
    runtimeClassName: nvidia
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: extensions.talos.dev/nonfree-kmod-nvidia-production
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9400"
    serviceMonitor:
      enabled: false
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      capabilities:
        add: []
        drop: [ALL]
      allowPrivilegeEscalation: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
    customMetrics: |
      DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization in percent.
      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, GPU memory utilization in percent.
      DCGM_FI_DEV_FB_USED, gauge, GPU framebuffer memory used in MiB.
      DCGM_FI_DEV_FB_FREE, gauge, GPU framebuffer memory free in MiB.
      DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature in Celsius.
      DCGM_FI_DEV_POWER_USAGE, gauge, GPU power draw in watts.
      DCGM_FI_DEV_SM_CLOCK, gauge, GPU SM clock in MHz.
      DCGM_FI_DEV_MEM_CLOCK, gauge, GPU memory clock in MHz.