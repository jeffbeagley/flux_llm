apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: nvidia-device-plugin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.19.3"
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system
  values:
    runtimeClass:
      enabled: true  # creates the "nvidia" RuntimeClass
    securityContext:
      privileged: true
    # libs in /usr/local/lib; devices remain at /dev
    config:
      default: "default"
      map:
        default: |-
          version: v1
          flags:
            nvidiaDriverRoot: /usr/local
            nvidiaDevRoot: /
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: extensions.talos.dev/nonfree-kmod-nvidia-production
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
