apiVersion: v1
kind: PersistentVolume
metadata:
  name: piper-cache
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/mnt/piper-cache
    type: DirectoryOrCreate
  claimRef:
    namespace: voice-agent
    name: piper-cache