apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: vllm
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: vllm-stack
      version: "0.1.12"
      sourceRef:
        kind: HelmRepository
        name: vllm
        namespace: flux-system
  values:
    servingEngineSpec:
      modelSpec:
        - name: "llm"
          # Set enabled: true and fill in modelURL before syncing
          enabled: false
          runtimeClassName: "nvidia"
          repository: "lmcache/vllm-openai"
          tag: "latest"
          modelURL: ""  # e.g. "meta-llama/Llama-3.1-8B-Instruct"
          replicaCount: 1
          requestCPU: 6
          requestMemory: "16Gi"
          requestGPU: 1
          requestGPUType: "nvidia.com/gpu"
          limitCPU: 8
          limitMemory: "32Gi"
