apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm
  namespace: vllm
spec:
  interval: 1h
  timeout: 15m
  targetNamespace: vllm
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: nvidia-device-plugin
      namespace: nvidia-device-plugin
  chart:
    spec:
      chart: vllm-stack
      version: "0.1.12"
      sourceRef:
        kind: HelmRepository
        name: vllm
        namespace: vllm
  values:
    routerSpec:
      serviceType: NodePort
      nodePort: 30800
    servingEngineSpec:
      startupProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 60
      modelSpec:
        - name: "qwen3-5-9b"
          enabled: true
          runtimeClassName: "nvidia"
          repository: "lmcache/vllm-openai"
          tag: "latest"
          modelURL: "cyankiwi/Qwen3.5-9B-AWQ-4bit"
          replicaCount: 1
          requestCPU: 6
          requestMemory: "16Gi"
          requestGPU: 1
          requestGPUType: "nvidia.com/gpu"
          limitCPU: 8
          limitMemory: "22Gi"
          env:
            - name: HF_HUB_CACHE
              value: /model-cache/hub
            - name: HUGGINGFACE_HUB_CACHE
              value: /model-cache/hub
            - name: TRANSFORMERS_CACHE
              value: /model-cache/transformers
          extraVolumeMounts:
            - name: model-cache
              mountPath: /model-cache
          extraVolumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: vllm-model-cache
          vllmConfig:
            extraArgs:
              - "--quantization=compressed-tensors"
              - "--dtype=auto"
              - "--trust-remote-code"
              - "--tensor-parallel-size=1"  
              - "--max-model-len=65536"          # ← biggest win (was 262k)
              - "--gpu-memory-utilization=0.55"  # ← leave headroom for other models
              - "--enable-auto-tool-choice"
              - "--tool-call-parser=qwen3_coder"
              - "--reasoning-parser=qwen3"
              - "--max-num-seqs=64"
