apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  targetNamespace: vllm
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: nvidia-device-plugin
  chart:
    spec:
      chart: vllm-stack
      version: "0.1.12"
      sourceRef:
        kind: HelmRepository
        name: vllm
        namespace: flux-system
  values:
    routerSpec:
      serviceType: NodePort
      nodePort: 30800
    servingEngineSpec:
      startupProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 60
      modelSpec:
        - name: "qwen3-8-27b-fp8"
          enabled: true
          runtimeClassName: "nvidia"
          repository: "lmcache/vllm-openai"
          tag: "latest"
          modelURL: "Qwen/Qwen3.8-27B-FP8"
          replicaCount: 1
          requestCPU: 6
          requestMemory: "16Gi"
          requestGPU: 1
          requestGPUType: "nvidia.com/gpu"
          limitCPU: 8
          limitMemory: "32Gi"
          vllmConfig:
            extraArgs:
              - "--reasoning-parser"
              - "deepseek_r1"
              - "--gpu-memory-utilization=0.98"
              - "--max-model-len=16384"
