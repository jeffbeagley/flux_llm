# HelmRelease controllers — one entry per chart deployment.
# Reference this file from infrastructure/kustomization.yaml once you add an entry.
#
# ---
# apiVersion: helm.toolkit.fluxcd.io/v2
# kind: HelmRelease
# metadata:
#   name: <release-name>       # e.g. ingress-nginx
#   namespace: <namespace>     # target namespace; create it separately if needed
# spec:
#   interval: 1h
#   chart:
#     spec:
#       chart: <chart-name>    # e.g. ingress-nginx
#       version: ">=4.0.0"
#       sourceRef:
#         kind: HelmRepository
#         name: <repo-name>    # must match a name in helm-repos.yaml
#         namespace: flux-system
#   values: {}
#   # To load values from config/:
#   # valuesFrom:
#   #   - kind: ConfigMap
#   #     name: <release-name>-values
#   #     namespace: <namespace>
