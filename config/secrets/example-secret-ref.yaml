# Secret reference — use an external secrets operator (e.g. External Secrets Operator,
# Sealed Secrets, or SOPS-encrypted Secret) rather than storing plaintext here.
#
# External Secrets Operator example:
# ---
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: <secret-name>
#   namespace: <namespace>
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: <store-name>
#     kind: ClusterSecretStore
#   target:
#     name: <secret-name>
#   data:
#     - secretKey: <key>
#       remoteRef:
#         key: <remote-key>
#
# SOPS-encrypted Secret (committed encrypted, decrypted by Flux):
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: <secret-name>
#   namespace: <namespace>
# stringData:
#   key: ENC[AES256_GCM,...]   # encrypted with sops
